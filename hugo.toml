baseURL = 'https://junpingkoch-web.github.io/watch-guide-blog/'
locale = 'zh-cn'
title = '钟表与星辰：瑞士生活手记'
theme = 'PaperMod'
hasCJKLanguage = true

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[params]
  env = 'production'
  description = '一线奢侈腕表零售经验 x 欧洲购表与免税攻略 x 二手表行情——来自瑞士德语区从业者的第一手笔记。'
  author = 'Junping Koch'
  images = ['https://junpingkoch-web.github.io/images/watch-blog-display-case.jpg']
  defaultTheme = 'auto'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = false
  ShowWordCount = true
  ShareButtons = ["linkedin"]
  ShowRssButtonInSectionTermList = true
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "钟表与星辰：瑞士生活手记"
    Content = "一线奢侈腕表零售从业者写给二手表买家的实战笔记：真伪鉴别、欧洲购表免税攻略、二手行情观察。\n\n延伸阅读：[瑞士制表业简史——从日内瓦的新教工匠到石英危机后的复兴](posts/swiss-watchmaking-brief-history/)"

